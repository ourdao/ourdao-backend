name: Mutation Testing

# Scheduled and manual dispatch only (#209).
# Mutation testing against the real Postgres database is computationally
# intensive and must serialize test runs (concurrency: 1) to prevent resetDb()
# TRUNCATE races. Running on per-PR CI would introduce 15-30m build delays.
on:
  schedule:
    - cron: '0 3 * * 1' # Weekly at 03:00 UTC on Mondays
  workflow_dispatch:

jobs:
  mutation-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ourdao
          POSTGRES_PASSWORD: ourdao
          POSTGRES_DB: ourdao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourdao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://ourdao:ourdao@localhost:5432/ourdao_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing (Stryker)
        run: npx stryker run
        continue-on-error: true

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
