name: Soroban RPC Smoke Test

permissions:
  contents: read

# Scheduled and on-demand smoke test verifying real Soroban RPC response shapes (#206).
# Excluded from PRs to avoid public testnet rate limits and latency blocking merges.
on:
  schedule:
    - cron: '0 5 * * *' # Daily at 05:00 UTC
  workflow_dispatch:
    inputs:
      soroban_rpc_url:
        description: 'Soroban RPC endpoint URL'
        required: false
        default: 'https://soroban-testnet.stellar.org'
      contract_id:
        description: 'Testnet OurDAO contract ID to poll'
        required: false
        default: ''

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ourdao
          POSTGRES_PASSWORD: ourdao
          POSTGRES_DB: ourdao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourdao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://ourdao:ourdao@localhost:5432/ourdao_test
      RUN_RPC_SMOKE: 'true'
      SOROBAN_RPC_URL: ${{ inputs.soroban_rpc_url || 'https://soroban-testnet.stellar.org' }}
      CONTRACT_ID: ${{ inputs.contract_id || '' }}

    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Soroban RPC wire smoke test
        run: npm run test:smoke
