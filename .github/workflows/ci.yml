name: CI

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22, 24]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ourdao
          POSTGRES_PASSWORD: ourdao
          POSTGRES_DB: ourdao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourdao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://ourdao:ourdao@localhost:5432/ourdao_test

    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: OpenAPI spec is up to date
        run: npm run openapi:validate

      - name: License check
        run: npm run license:check

      # Issue #290: verify all migrations in src/db/migrations/ apply cleanly
      # to a fresh database and produce a schema matching src/db/schema.sql,
      # and assert no duplicate migration version IDs exist. Runs as a
      # distinct step so failures are attributable at a glance before the
      # full coverage gate runs.
      - name: Migration dry-run verification
        run: npm run test -- --reporter=verbose test/migration-dry-run.test.ts

      # Runs the full suite with v8 coverage instrumentation and enforces the
      # thresholds in vitest.config.ts (#79). Replaces the plain `npm test`
      # step — same tests, plus the report. Observed runtime delta on CI: a
      # few seconds (instrumentation only; the suite already runs once).
      - name: Test + coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo '### Coverage'
              echo ''
              echo '#### Overall'
              echo ''
              echo '| metric | % | covered / total |'
              echo '| --- | --- | --- |'
              node -e '
                const t = require("./coverage/coverage-summary.json").total;
                for (const k of ["lines","statements","functions","branches"])
                  console.log(`| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`);
              '
              echo ''
              echo '#### Per-Module Coverage (issue #208)'
              echo ''
              echo '| module | lines | functions | branches | statements |'
              echo '| --- | --- | --- | --- | --- |'
              node -e '
                const summary = require("./coverage/coverage-summary.json");
                const modules = {
                  "src/indexer/": [],
                  "src/auth.ts": [],
                  "src/api/": [],
                  "src/db/": [],
                  "src/stellar/": [],
                };
                
                // Aggregate coverage by module
                for (const [file, data] of Object.entries(summary)) {
                  if (file === "total") continue;
                  
                  for (const [module, files] of Object.entries(modules)) {
                    if (file.includes(module)) {
                      files.push(data);
                      break;
                    }
                  }
                }
                
                // Calculate and print per-module totals
                for (const [module, files] of Object.entries(modules)) {
                  if (files.length === 0) continue;
                  
                  const totals = { lines: {covered:0, total:0}, functions: {covered:0, total:0},
                                   branches: {covered:0, total:0}, statements: {covered:0, total:0} };
                  
                  for (const file of files) {
                    for (const metric of ["lines", "functions", "branches", "statements"]) {
                      totals[metric].covered += file[metric].covered;
                      totals[metric].total += file[metric].total;
                    }
                  }
                  
                  const pcts = {};
                  for (const metric of ["lines", "functions", "branches", "statements"]) {
                    pcts[metric] = totals[metric].total > 0 
                      ? ((totals[metric].covered / totals[metric].total) * 100).toFixed(1)
                      : "0.0";
                  }
                  
                  console.log(`| ${module} | ${pcts.lines}% | ${pcts.functions}% | ${pcts.branches}% | ${pcts.statements}% |`);
                }
              '
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: npm run build

  # #76 — the deployment artifact (the container image) was the one output
  # with no automated verification. Independent job so a failure here is
  # attributable at a glance and doesn't block the source gates.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ourdao
          POSTGRES_PASSWORD: ourdao
          POSTGRES_DB: ourdao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourdao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: postgres://ourdao:ourdao@localhost:5432/ourdao_test
      IMAGE: ourdao-backend:ci

    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

      - uses: docker/setup-buildx-action@3d68780484996aa9d417bb9016193885cdf1f299 # v3.6.0

      - name: Build image (no push)
        uses: docker/build-push-action@15560696de535e4014efeff63c48f16952e52dd1 # v6.2.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          provenance: false

      # Issue #219: SBOM covering base image + npm dependencies. Generated from
      # the loaded image: buildx SBOM attestations can't be loaded into the
      # local Docker image store ("docker exporter does not support manifest lists").
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

      # Vulnerability scan (#212): scan the built image with Trivy.
      # Publishes full findings to GitHub Actions step summary and enforces
      # a failure policy on HIGH and CRITICAL vulnerabilities.
      - name: Scan image with Trivy (capture summary)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Publish vulnerability scan results to summary
        if: always()
        run: |
          if [ -f trivy-results.txt ]; then
            {
              echo '### Container Vulnerability Scan (Trivy)'
              echo ''
              echo '```text'
              cat trivy-results.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce vulnerability policy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: '.trivyignore'

      - name: Enforce vulnerability policy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: '.trivyignore'

      # The `cp src/db/schema.sql … && cp -r src/db/migrations …` build step is
      # the failure most likely to reach production silently: add a migration,
      # forget the copy, image starts and dies at runtime while CI is green.
      - name: dist/ contains schema.sql, migrations/, and both entrypoints
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            test -s dist/db/schema.sql
            test -d dist/db/migrations
            [ -n "$(ls -A dist/db/migrations)" ]
            test -f dist/index.js
            test -f dist/worker.js
          '

      # A dependency wrongly placed in devDependencies breaks the runtime
      # stage (npm ci --omit=dev) and nothing else — assert the app actually
      # loads with only production deps installed.
      - name: production dependency tree resolves
        run: docker run --rm --entrypoint node "$IMAGE" -e "require('fastify'); require('pg'); require('@stellar/stellar-sdk')"

      - name: runs as the non-root 'node' user
        run: |
          got="$(docker run --rm --entrypoint id "$IMAGE" -un)"
          echo "user: $got"
          test "$got" = node

      - name: HEALTHCHECK binary (wget) is present
        run: docker run --rm --entrypoint sh "$IMAGE" -c 'command -v wget'

      - name: image labels are populated from build args
        run: |
          rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          echo "revision label: $rev"
          test "$rev" = "${{ github.sha }}"

      - name: API entrypoint boots and the HEALTHCHECK reports healthy
        run: |
          docker run -d --name api --network host \
            --health-interval=3s --health-start-period=3s --health-retries=10 \
            -e DATABASE_URL="$DB_URL" -e PORT=4000 -e CONTRACT_ID=CTEST "$IMAGE"
          status=starting
          for _ in $(seq 1 40); do
            s="$(docker inspect -f '{{.State.Health.Status}}' api)"
            [ "$s" = healthy ] && { status=healthy; break; }
            [ "$s" = unhealthy ] && { status=unhealthy; break; }
            sleep 2
          done
          echo "--- api logs ---"; docker logs api
          curl -fsS -o /dev/null -w 'GET /health -> %{http_code}\n' http://localhost:4000/health
          docker rm -f api >/dev/null
          test "$status" = healthy

      - name: worker entrypoint boots and exits 0 on SIGTERM
        run: |
          docker run -d --name worker --network host \
            -e DATABASE_URL="$DB_URL" -e CONTRACT_ID=CTEST \
            "$IMAGE" node dist/worker.js
          # Bound startup observation independently of the job timeout.
          for _ in $(seq 1 10); do
            docker inspect -f '{{.State.Running}}' worker | grep -qx true || break
            sleep 1
          done
          echo "--- worker logs ---"; docker logs worker
          docker inspect -f '{{.State.Running}}' worker | grep -qx true
          docker stop -t 15 worker
          code="$(docker inspect -f '{{.State.ExitCode}}' worker)"
          echo "worker exit code: $code"
          docker rm -f worker >/dev/null
          test "$code" = 0
